name: Neutral original and candidate DayTrigger numeric ART method probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/day-numeric-method-probe.yml'
      - 'tools/day_numeric_art/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: day-numeric-method-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  day-numeric-method-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact reviewed numeric tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/day-numeric-method-probe.yml
            tools/day_numeric_art

      - name: Check out the immutable runtime and fixed APK parts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fc825ede39a40249e33c8ba75b93128a98bd5e3c
          path: parent-inputs
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/widget-method-probe.yml
            scripts/assemble_artifact.py
            tools/android/bootstrap_android_runtime.py
            tools/android/android-toolchain-pins.json
            tools/android/android_runtime_service.py
            tools/android/runtime_job.py
            tools/android/wait_android_ready.py
            tools/android/test_download_retry.py
            vendor/original
            work-in-progress/day-trigger-numeric/10-hosted-accepted-artifact

      - name: Pin all numeric source, runtime and multipart input roles
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-day-numeric-art
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C parent-inputs rev-parse HEAD)" = fc825ede39a40249e33c8ba75b93128a98bd5e3c
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          pins = {
              'tools/day_numeric_art/preflight.py': '61ac7a308128661eda663d1c36ee47baba238c2aa8ded9e0545fe5939e3cffd5',
              'tools/day_numeric_art/runtime-files.json': 'e3e6b34e6a531c1fe1ba2d82aef1a25fbb5fbd4535028564d8e7af6c3b8b0be3',
          }
          for name, expected in pins.items():
              path = Path(name)
              if path.is_symlink() or not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit('Exact numeric workflow entry point changed: ' + name)
          print('Both exact numeric workflow entry points verified.')
          PY
          timeout 120s python3 -B tools/day_numeric_art/preflight.py             --current "$GITHUB_WORKSPACE" --parent "$GITHUB_WORKSPACE/parent-inputs"             --output "$GITHUB_WORKSPACE/ci-day-numeric-art/preflight-inputs" --phase inputs             2>&1 | tee ci-day-numeric-art/input-preflight.log

      - name: Run the six downloader and all forty-two simulated wrapper controls
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s python3 -B -m unittest discover -s parent-inputs/tools/android             -p 'test_download_retry.py' -v 2>&1 | tee ci-day-numeric-art/download-tests.log
          export NUMERIC_PROBE_CONTROL_EVIDENCE="$GITHUB_WORKSPACE/ci-day-numeric-art/host-control-evidence"
          timeout 240s python3 -B -m unittest discover -s tools/day_numeric_art             -p 'test_android_day_numeric_method_probe.py' -v 2>&1 | tee ci-day-numeric-art/wrapper-tests.log
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          rows = []
          for name, expected in [('download-tests.log', 6), ('wrapper-tests.log', 42)]:
              raw = (Path('ci-day-numeric-art') / name).read_text()
              summaries = re.findall(r'^Ran (\d+) tests in ([0-9.]+)s$', raw, re.M)
              if len(summaries) != 1 or int(summaries[0][0]) != expected or not raw.rstrip().endswith('OK'):
                  raise SystemExit('The exact full host control inventory did not pass: ' + name)
              rows.append({'log': name, 'tests': expected, 'seconds': summaries[0][1]})
          Path('ci-day-numeric-art/host-control-summary.json').write_text(json.dumps(rows, indent=2) + '\n')
          PY

      - name: Assemble only the fixed original and accepted numeric candidate APKs
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s python3 -B parent-inputs/scripts/assemble_artifact.py             parent-inputs/vendor/original/manifest.json             2>&1 | tee ci-day-numeric-art/materialize-original.log
          timeout 120s python3 -B parent-inputs/scripts/assemble_artifact.py             parent-inputs/work-in-progress/day-trigger-numeric/10-hosted-accepted-artifact/manifest.json             2>&1 | tee ci-day-numeric-art/materialize-numeric.log

      - name: Recheck all source and actual APK inputs before starting Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          pins = {
              'tools/day_numeric_art/preflight.py': '61ac7a308128661eda663d1c36ee47baba238c2aa8ded9e0545fe5939e3cffd5',
              'tools/day_numeric_art/runtime-files.json': 'e3e6b34e6a531c1fe1ba2d82aef1a25fbb5fbd4535028564d8e7af6c3b8b0be3',
          }
          for name, expected in pins.items():
              path = Path(name)
              if path.is_symlink() or not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit('Exact numeric workflow entry point changed: ' + name)
          print('Both exact numeric workflow entry points verified.')
          PY
          timeout 120s python3 -B tools/day_numeric_art/preflight.py             --current "$GITHUB_WORKSPACE" --parent "$GITHUB_WORKSPACE/parent-inputs"             --output "$GITHUB_WORKSPACE/ci-day-numeric-art/preflight-apks" --phase apks             2>&1 | tee ci-day-numeric-art/apk-preflight.log

      - name: Install the checksum-pinned disposable Android runtime
        shell: bash
        run: |
          set -euo pipefail
          if test -e "$RUNNER_TEMP/macrodroid-numeric-art-tooling"; then
            echo 'Refusing to reuse an existing numeric ART runtime directory' | tee ci-day-numeric-art/bootstrap.log
            exit 1
          fi
          python3 parent-inputs/tools/android/bootstrap_android_runtime.py --root "$RUNNER_TEMP/macrodroid-numeric-art-tooling" --create-avd 2>&1 | tee ci-day-numeric-art/bootstrap.log
          python3 - <<'PY' 2>&1 | tee ci-day-numeric-art/toolchain-metadata.log
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'macrodroid-numeric-art-tooling'
          output = Path('ci-day-numeric-art/toolchain')
          output.mkdir()
          metadata = ['jdk21/release', 'android/platform-tools/source.properties',
              'android/emulator/source.properties',
              'android/system-images/android-35/google_apis/x86_64/source.properties',
              'android/system-images/android-35/google_apis/x86_64/build.prop',
              'android-user/avd/MacroDroid_API35_Disposable.ini',
              'android-user/avd/MacroDroid_API35_Disposable.avd/config.ini']
          binaries = ['jdk21/bin/java', 'jdk21/bin/javac', 'android/platform-tools/adb',
              'android/emulator/emulator', 'android/emulator/qemu/linux-x86_64/qemu-system-x86_64-headless']
          rows = []
          for name in metadata + binaries:
              path = root / name
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              rows.append({'path': name, 'bytes': path.stat().st_size, 'sha256': digest})
              if name in metadata:
                  target = output / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(path.read_bytes())
          (output / 'installed-inputs.json').write_text(json.dumps(rows, indent=2) + '\n')
          print(json.dumps(rows, indent=2))
          PY

      - name: Run the neutral probe once per exact APK with verification enabled
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee ci-day-numeric-art/runtime-driver.log) 2>&1
          if ! test -c /dev/kvm; then
            echo 'The disposable KVM device is unavailable'
            exit 1
          fi
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          mkdir ci-day-numeric-art/environment
          python3 -u parent-inputs/tools/android/android_runtime_service.py \
            --tooling "$RUNNER_TEMP/macrodroid-numeric-art-tooling" \
            --evidence ci-day-numeric-art/environment \
            --avd MacroDroid_API35_Disposable --port 5560 --acceleration on \
            > ci-day-numeric-art/service.log 2>&1 &
          numeric_service_pid=$!
          cleanup_numeric_runtime() {
            numeric_step_status=$?
            trap - EXIT INT TERM
            set +e
            timeout 30s "$RUNNER_TEMP/macrodroid-numeric-art-tooling/android/platform-tools/adb" \
              -s emulator-5560 logcat -d -b crash -b events -v threadtime \
              > ci-day-numeric-art/lifecycle.log 2>&1
            numeric_logcat_status=$?
            mkdir -p ci-day-numeric-art/environment/queue
            touch ci-day-numeric-art/environment/queue/STOP
            numeric_stop_status=$?
            timeout 60s tail --pid="$numeric_service_pid" -f /dev/null
            numeric_wait_status=$?
            numeric_service_status=unobserved
            if test "$numeric_wait_status" -eq 0; then
              wait "$numeric_service_pid"
              numeric_service_status=$?
            fi
            python3 - "$numeric_step_status" "$numeric_logcat_status" "$numeric_stop_status" \
              "$numeric_wait_status" "$numeric_service_status" <<'PY'
          import json, sys
          from pathlib import Path
          names = ['probe_step_exit_code', 'diagnostic_logcat_exit_code', 'owned_stop_marker_exit_code',
                   'bounded_service_wait_exit_code', 'owned_service_exit_code']
          result = dict(zip(names, sys.argv[1:]))
          result['scope'] = 'STOP is written only to this job\'s newly created service queue; no unrelated device or process is stopped.'
          result['service_cleanup_confirmed'] = sys.argv[3:] == ['0', '0', '0']
          Path('ci-day-numeric-art/runtime-cleanup.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
            numeric_cleanup_record_status=$?
            if test "$numeric_step_status" -eq 0 && { test "$numeric_stop_status" -ne 0 || test "$numeric_wait_status" -ne 0 || test "$numeric_service_status" != 0 || test "$numeric_cleanup_record_status" -ne 0; }; then
              numeric_step_status=1
            fi
            exit "$numeric_step_status"
          }
          trap cleanup_numeric_runtime EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$numeric_service_pid" > ci-day-numeric-art/owned-service-pid.txt
          python3 parent-inputs/tools/android/wait_android_ready.py --evidence ci-day-numeric-art/environment --timeout 900 \
            2>&1 | tee ci-day-numeric-art/readiness.log
          python3 parent-inputs/tools/android/runtime_job.py --queue ci-day-numeric-art/environment/queue \
            --id day-numeric-method-art --timeout 720 -- \
            python3 "$GITHUB_WORKSPACE/tools/day_numeric_art/android_numeric_method_probe.py" \
              --adb "$RUNNER_TEMP/macrodroid-numeric-art-tooling/android/platform-tools/adb" \
              --serial emulator-5560 --avd MacroDroid_API35_Disposable \
              --original "$GITHUB_WORKSPACE/parent-inputs/workspace/artifacts/MacroDroid-5.67.8-original.apk" \
              --candidate "$GITHUB_WORKSPACE/parent-inputs/workspace/artifacts/MacroDroid-5.67.8-day-numeric-0762aad9.apk" \
              --probe "$GITHUB_WORKSPACE/tools/day_numeric_art/probes/day-numeric-method-probe.dex" \
              --provenance "$GITHUB_WORKSPACE/tools/day_numeric_art/probes/day-numeric-method-probe.json" \
              --output "$GITHUB_WORKSPACE/ci-day-numeric-art/probe" --timeout 120 \
            2>&1 | tee ci-day-numeric-art/runtime-job.log

      - name: Recheck final fixed inputs and the complete real probe evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-day-numeric-art
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          pins = {
              'tools/day_numeric_art/preflight.py': '61ac7a308128661eda663d1c36ee47baba238c2aa8ded9e0545fe5939e3cffd5',
              'tools/day_numeric_art/runtime-files.json': 'e3e6b34e6a531c1fe1ba2d82aef1a25fbb5fbd4535028564d8e7af6c3b8b0be3',
          }
          for name, expected in pins.items():
              path = Path(name)
              if path.is_symlink() or not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit('Exact numeric workflow entry point changed: ' + name)
          print('Both exact numeric workflow entry points verified.')
          PY
          timeout 120s python3 -B tools/day_numeric_art/preflight.py             --current "$GITHUB_WORKSPACE" --parent "$GITHUB_WORKSPACE/parent-inputs"             --output "$GITHUB_WORKSPACE/ci-day-numeric-art/final-verification" --phase final             --probe-result "$GITHUB_WORKSPACE/ci-day-numeric-art/probe"             2>&1 | tee ci-day-numeric-art/final-verification.log

      - name: Preserve complete raw, partial, executed-source and host-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day-numeric-method-probe-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: ci-day-numeric-art/
          include-hidden-files: true
