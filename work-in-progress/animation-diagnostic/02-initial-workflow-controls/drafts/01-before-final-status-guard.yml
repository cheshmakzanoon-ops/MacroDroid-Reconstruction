name: Independent normal-animation ten-screen comparison

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editor-normal-animation.yml'
      - 'work-in-progress/animation-diagnostic/02-reviewed-workflow/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-normal-animation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  editor-normal-animation:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact reviewed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify and copy the frozen ten-screen guard and diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          pins = {
              'work-in-progress/animation-diagnostic/02-reviewed-workflow/prepare_normal_journey.py': '0f0c022f556f9798afd886e1943f6e2fc63e35dc0498abe1e6db2b53fce72129',
              'work-in-progress/animation-diagnostic/02-reviewed-workflow/verify_normal_journey.py': '8e1c38a494880b73d09c0d16ef94bcfc3067d55805d12bc67b3b8ed30220eeaa',
          }
          for name, expected in pins.items():
              path = Path(name)
              if path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise RuntimeError('Reviewed diagnostic helper changed: ' + name)
          PY
          python3 work-in-progress/animation-diagnostic/02-reviewed-workflow/prepare_normal_journey.py --root "$GITHUB_WORKSPACE" --output ci-normal-animation

      - name: Run the frozen capture, animation and downloader host controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tools/android -p 'test_download_retry.py' -v 2>&1 | tee ci-normal-animation/download-tests.log
          python3 -B -m unittest discover -s ci-normal-animation/reviewed-source/tools/parity_journeys -p 'test_*.py' -v 2>&1 | tee ci-normal-animation/journey-host-tests.log
          python3 -B -m unittest discover -s work-in-progress/animation-diagnostic/01-normal-animation-source -p 'test_enable_normal_animations.py' -v 2>&1 | tee ci-normal-animation/animation-host-tests.log

      - name: Inspect both exact APKs using the preserved AAPT2 tool
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_v9.py --without-overlay 2>&1 | tee ci-normal-animation/materialize-toolchain.log
          python3 scripts/assemble_artifact.py vendor/original/manifest.json 2>&1 | tee ci-normal-animation/materialize-original.log
          python3 scripts/assemble_artifact.py artifacts/current/manifest.json 2>&1 | tee ci-normal-animation/materialize-candidate.log
          python3 work-in-progress/animation-diagnostic/02-reviewed-workflow/prepare_normal_journey.py --root "$GITHUB_WORKSPACE" --output ci-normal-animation --materialized 2>&1 | tee ci-normal-animation/apk-preflight.log

      - name: Install the pinned disposable runtime and preserve toolchain identities
        shell: bash
        run: |
          set -euo pipefail
          if test -e "$RUNNER_TEMP/macrodroid-normal-animation-tooling"; then
            echo 'Refusing to reuse an existing normal-animation runtime directory' | tee ci-normal-animation/bootstrap.log
            exit 1
          fi
          python3 tools/android/bootstrap_android_runtime.py --root "$RUNNER_TEMP/macrodroid-normal-animation-tooling" --create-avd 2>&1 | tee ci-normal-animation/bootstrap.log
          python3 - <<'PY' 2>&1 | tee ci-normal-animation/toolchain-metadata.log
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'macrodroid-normal-animation-tooling'
          output = Path('ci-normal-animation/toolchain')
          output.mkdir()
          metadata = ['jdk21/release', 'android/platform-tools/source.properties',
              'android/emulator/source.properties',
              'android/system-images/android-35/google_apis/x86_64/source.properties',
              'android/system-images/android-35/google_apis/x86_64/build.prop',
              'android-user/avd/MacroDroid_API35_Disposable.ini',
              'android-user/avd/MacroDroid_API35_Disposable.avd/config.ini']
          binaries = ['jdk21/bin/java', 'jdk21/bin/javac', 'android/platform-tools/adb',
              'android/emulator/emulator', 'android/emulator/qemu/linux-x86_64/qemu-system-x86_64-headless']
          rows = []
          for name in metadata + binaries:
              path = root / name
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              rows.append({'path': name, 'bytes': path.stat().st_size, 'sha256': digest})
              if name in metadata:
                  target = output / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(path.read_bytes())
          (output / 'installed-inputs.json').write_text(json.dumps(rows, indent=2) + '\n')
          print(json.dumps(rows, indent=2))
          PY

      - name: Observe the same ten screens with normal animation scales
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee ci-normal-animation/runtime-driver.log) 2>&1
          if ! test -c /dev/kvm; then
            echo 'The disposable KVM device is unavailable'
            exit 1
          fi
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          mkdir ci-normal-animation/environment
          python3 -u tools/android/android_runtime_service.py \
            --tooling "$RUNNER_TEMP/macrodroid-normal-animation-tooling" \
            --evidence ci-normal-animation/environment \
            --avd MacroDroid_API35_Disposable --port 5560 --acceleration on \
            > ci-normal-animation/service.log 2>&1 &
          normal_service_pid=$!
          cleanup_normal_runtime() {
            normal_step_status=$?
            trap - EXIT INT TERM
            set +e
            timeout 30s "$RUNNER_TEMP/macrodroid-normal-animation-tooling/android/platform-tools/adb" \
              -s emulator-5560 logcat -d -b crash -b events -v threadtime \
              > ci-normal-animation/lifecycle.log 2>&1
            normal_logcat_status=$?
            mkdir -p ci-normal-animation/environment/queue
            touch ci-normal-animation/environment/queue/STOP
            normal_stop_status=$?
            timeout 60s tail --pid="$normal_service_pid" -f /dev/null
            normal_wait_status=$?
            normal_service_status=unobserved
            if test "$normal_wait_status" -eq 0; then
              wait "$normal_service_pid"
              normal_service_status=$?
            fi
            python3 - "$normal_step_status" "$normal_logcat_status" "$normal_stop_status" \
              "$normal_wait_status" "$normal_service_status" <<'PY'
          import json, sys
          from pathlib import Path
          names = ['journey_step_exit_code', 'diagnostic_logcat_exit_code', 'owned_stop_marker_exit_code',
                   'bounded_service_wait_exit_code', 'owned_service_exit_code']
          result = dict(zip(names, sys.argv[1:]))
          result['scope'] = 'STOP is written only to this job\'s newly created service queue; no unrelated device or process is stopped.'
          result['service_cleanup_confirmed'] = sys.argv[3:] == ['0', '0', '0']
          Path('ci-normal-animation/runtime-cleanup.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
            normal_cleanup_record_status=$?
            if test "$normal_step_status" -eq 0 && { test "$normal_stop_status" -ne 0 || test "$normal_wait_status" -ne 0 || test "$normal_service_status" != 0 || test "$normal_cleanup_record_status" -ne 0; }; then
              normal_step_status=1
            fi
            exit "$normal_step_status"
          }
          trap cleanup_normal_runtime EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$normal_service_pid" > ci-normal-animation/owned-service-pid.txt
          python3 tools/android/wait_android_ready.py --evidence ci-normal-animation/environment --timeout 900 \
            2>&1 | tee ci-normal-animation/readiness.log
          python3 tools/android/runtime_job.py --queue ci-normal-animation/environment/queue   --id normal-animation-radio-clock --timeout 240 --   python3 "$GITHUB_WORKSPACE/tools/android/configure_capture_device.py"     --adb "$RUNNER_TEMP/macrodroid-normal-animation-tooling/android/platform-tools/adb"     --serial emulator-5560 --output "$GITHUB_WORKSPACE/ci-normal-animation/device" --demo-clock 1200   2>&1 | tee ci-normal-animation/device-job.log
          python3 tools/android/runtime_job.py --queue ci-normal-animation/environment/queue   --id normal-animation-settings --timeout 360 --   python3 "$GITHUB_WORKSPACE/work-in-progress/animation-diagnostic/01-normal-animation-source/enable_normal_animations.py"     --adb "$RUNNER_TEMP/macrodroid-normal-animation-tooling/android/platform-tools/adb"     --serial emulator-5560 --output "$GITHUB_WORKSPACE/ci-normal-animation/animation-settings"   2>&1 | tee ci-normal-animation/animation-job.log
          python3 tools/android/runtime_job.py --queue ci-normal-animation/environment/queue   --id normal-animation-ten-screen --timeout 2400 --   python3 "$GITHUB_WORKSPACE/ci-normal-animation/reviewed-source/tools/parity_journeys/favourite_info_journey.py"     --source "$GITHUB_WORKSPACE/ci-normal-animation/reviewed-source/project"     --original "$GITHUB_WORKSPACE/workspace/artifacts/MacroDroid-5.67.8-original.apk"     --candidate "$GITHUB_WORKSPACE/workspace/artifacts/MacroDroid-5.67.8-current-hybrid.apk"     --output "$GITHUB_WORKSPACE/ci-normal-animation/journey" --serial emulator-5560     --accept-package-data-removal --observe-denial-handoff --settle-full-frames   2>&1 | tee ci-normal-animation/journey-job.log

      - name: Recheck raw animation settings, ordered captures and exact pixels
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-normal-animation
          python3 work-in-progress/animation-diagnostic/02-reviewed-workflow/verify_normal_journey.py --root "$GITHUB_WORKSPACE" --output ci-normal-animation 2>&1 | tee ci-normal-animation/independent-comparison.log

      - name: Preserve the complete owned diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editor-normal-animation-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: ci-normal-animation/
          include-hidden-files: true
