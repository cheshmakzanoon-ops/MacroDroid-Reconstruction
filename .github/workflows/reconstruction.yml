name: Reconstruction build and verification

on:
  push:
    branches: [main]
    paths:
      - 'project/**'
      - 'vendor/v9/**'
      - 'vendor/original/**'
      - 'artifacts/current/**'
      - 'tools/android/**'
      - 'scripts/**'
      - '.github/workflows/reconstruction.yml'
  pull_request:
    paths:
      - 'project/**'
      - 'vendor/v9/**'
      - 'vendor/original/**'
      - 'artifacts/current/**'
      - 'tools/android/**'
      - 'scripts/**'
      - '.github/workflows/reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconstruction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the complete source snapshot and current changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and materialize the repository source
        run: python3 scripts/materialize_v9.py
      - name: Build both APKs and run the full configured acceptance suite
        working-directory: workspace/MacroDroid_v9
        env:
          PYTHONUTF8: '1'
        run: python3 acceptance.py
      - name: Check the committed candidate against the fresh source build
        run: |
          python3 scripts/assemble_artifact.py artifacts/current/manifest.json
          cmp workspace/artifacts/MacroDroid-5.67.8-current-hybrid.apk workspace/MacroDroid_v9/dist/MacroDroid-5.67.8-v9-hybrid.apk
      - name: Preserve APKs and fresh verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reconstruction-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            workspace/MacroDroid_v9/dist/*.apk
            workspace/MacroDroid_v9/reports/acceptance-latest.json
            workspace/MacroDroid_v9/reports/acceptance-*/
            workspace/MacroDroid_v9/reports/*-build.json
            workspace/MacroDroid_v9/reports/*-roundtrip.json
            workspace/MacroDroid_v9/reports/*-resource-parity.json
            workspace/MacroDroid_v9/reports/*-signature-verification.log
            workspace/MacroDroid_v9/reports/*-negative-controls.json
            workspace/MacroDroid_v9/reports/negative-control.json
            workspace/MacroDroid_v9/reports/*-parity.json
            workspace/MacroDroid_v9/reports/*-semantics.json
            workspace/MacroDroid_v9/reports/python-unit-tests.log
            workspace/MacroDroid_v9/reports/*-differential-tests.log
            workspace/MacroDroid_v9/reports/full-apk-edit-probe.json
            workspace/MacroDroid_v9/reports/migration-static-proof.json
            workspace/MacroDroid_v9/reports/migration-linkage-check.json
            workspace/MacroDroid_v9/reports/reference-failures-status-v9.json
            workspace/MacroDroid_v9/reports/android-runtime/result.json

  android-cold-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact original, candidate, and verification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify and materialize the recorder and both APKs
        run: |
          python3 scripts/materialize_v9.py
          python3 scripts/assemble_artifact.py vendor/original/manifest.json
          python3 scripts/assemble_artifact.py artifacts/current/manifest.json
      - name: Install the checksum-pinned Android runtime
        run: python3 tools/android/bootstrap_android_runtime.py --root "$RUNNER_TEMP/macrodroid-tooling" --create-avd
      - name: Enable the runner user to use its allocated KVM device
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$RUNNER_TEMP/macrodroid-tooling/android/emulator/emulator" -no-window -accel-check
      - name: Compare complete cold-launch captures and four observed intro pages
        run: |
          python3 tools/android/run_ci_runtime.py \
            --tooling "$RUNNER_TEMP/macrodroid-tooling" \
            --source workspace/MacroDroid_v9 \
            --original workspace/artifacts/MacroDroid-5.67.8-original.apk \
            --candidate workspace/artifacts/MacroDroid-5.67.8-current-hybrid.apk \
            --output ci-runtime \
            --acceleration on
      - name: Preserve measured runtime outcomes, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-cold-launch-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ci-runtime/runtime-run.json
            ci-runtime/service.log
            ci-runtime/emulator-diagnostics.log
            ci-runtime/capture-device/
            ci-runtime/capture/
            ci-runtime/environment/emulator-launch.json
            ci-runtime/environment/runtime-status.json
            ci-runtime/environment/runtime-properties.json
